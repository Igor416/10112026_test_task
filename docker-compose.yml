services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card
      POSTGRES_DB: card
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U card -d card']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://card:card@postgres:5432/card?schema=public
      PROFILE_SLUG: main
      PORT: '3000'
      NODE_ENV: production
      PRISMA_LOG_QUERIES: 'true'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
